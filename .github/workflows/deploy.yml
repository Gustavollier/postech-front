name: Deploy no GitHub Pages

# Build do painel e publicação no GitHub Pages.
#
# Push na main -> build e publicação no branch gh-pages
# Pull request -> apenas build, para o PR não publicar nada
#
# A publicação é um push de branch, e não a API do Pages: o token do Actions
# desta conta não tem permissão para criar o site via API — configure-pages com
# enablement:true falha com "Resource not accessible by integration". Empurrar o
# conteúdo para gh-pages precisa apenas de contents:write, que o token tem.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build e publicação
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publicar no branch gh-pages
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          # Sem .nojekyll o Pages roda Jekyll, que ignora diretórios e arquivos
          # começando com underscore — os assets do Vite não seriam servidos.
          touch dist/.nojekyll

          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push -f \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages
